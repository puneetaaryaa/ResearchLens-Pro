<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResearchLens AI | Mobile Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Fira+Code&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00f2ff; --bg: #05070a; --card: #0f121a; --text: #e2e8f0; --accent: #7000ff;
        }
        
        * { box-sizing: border-box; }

        body {
            font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--text); margin: 0; line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- Navbar --- */
        .nav {
            padding: 15px 30px; background: rgba(10, 15, 25, 0.9); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(0, 242, 255, 0.15); display: flex; justify-content: space-between; 
            position: sticky; top: 0; z-index: 100; align-items: center;
        }

        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        
        /* --- Upload Box --- */
        .upload-box {
            background: var(--card); border: 2px dashed rgba(0, 242, 255, 0.3); border-radius: 20px; padding: 40px 20px;
            text-align: center; cursor: pointer; transition: 0.4s;
        }
        .upload-box:hover { border-color: var(--neon); background: rgba(0, 242, 255, 0.05); }
        
        /* --- Metrics Chips --- */
        .chip-group { display: flex; flex-wrap: wrap; gap: 10px; margin: 25px 0; }
        .metric-chip {
            background: rgba(0, 242, 255, 0.1); color: var(--neon); padding: 6px 14px; border-radius: 50px;
            font-size: 0.75rem; font-weight: 700; border: 1px solid rgba(0, 242, 255, 0.3);
        }

        /* --- Grid System --- */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px; 
            margin-top: 30px; 
        }

        /* Initial Hide Class */
        .hidden { display: none !important; }

        .info-card {
            background: var(--card); border: 1px solid #1e293b; border-radius: 15px; padding: 20px;
            transition: 0.3s;
        }
        .info-card h3 { 
            color: var(--neon); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; 
            margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
        }

        .citation-section {
            background: #000; border-radius: 12px; padding: 20px; margin-top: 20px; 
            font-family: 'Fira Code', monospace; font-size: 0.8rem; color: #888; 
            border-left: 4px solid var(--accent); overflow-x: auto;
        }

        /* --- Buttons --- */
        .btn-glow {
            background: var(--neon); color: #000; border: none; padding: 14px 30px; border-radius: 10px;
            font-weight: 800; cursor: pointer; transition: 0.3s; width: 100%; max-width: 300px;
        }
        .btn-download {
            background: white; color: black; margin-top: 30px; width: 100%; padding: 14px; border-radius: 10px; font-weight: 800; cursor: pointer; border: none;
        }

        #loader { display: none; color: var(--neon); margin: 20px 0; font-size: 0.9rem; letter-spacing: 2px; }

        /* 📱 MOBILE RESPONSIVENESS */
        @media (max-width: 768px) {
            .nav { padding: 12px 20px; }
            .nav div:last-child { display: none; } 
            .grid { grid-template-columns: 1fr; } /* Mobile par 1 column properly force karega */
            .container { margin: 20px auto; }
            .upload-box h2 { font-size: 1.2rem; }
            .info-card { padding: 18px; }
        }
    </style>
</head>
<body>

<div class="nav">
    <div style="font-weight: 700; font-size: 1.2rem;">RESEARCH<span style="color:var(--neon)">LENS</span></div>
    <div style="color: #444; font-family: monospace; font-size: 0.7rem;">GPU_ACTIVE: CPU_OPTIMIZED</div>
</div>

<div class="container">
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <div style="font-size: 2.5rem; margin-bottom: 15px;">📂</div>
        <h2 style="margin:0;">Select Research Paper</h2>
        <p style="color: #64748b; font-size: 0.9rem;">Upload PDF for Neural Extraction</p>
        <input type="file" id="fileInput" hidden accept=".pdf">
        <div id="fileLabel" style="margin-top: 15px; color: var(--neon); font-size: 0.8rem;"></div>
    </div>

    <center>
        <button class="btn-glow" id="startBtn" onclick="runAnalysis()" style="margin-top: 30px;">START ANALYSIS</button>
        <div id="loader">ANALYZING_DATA_STREAM...</div>
    </center>

    <div id="resultsArea" class="hidden">
        <h4 style="color: #444; font-size: 0.7rem; margin-top: 30px;">METRICS_LOG:</h4>
        <div class="chip-group" id="metricsBox"></div>
        
        <div class="grid" id="mainGrid">
            <div class="info-card"><h3>Problem</h3><p id="d_prob" style="font-size: 0.9rem;"></p></div>
            <div class="info-card"><h3>Summary</h3><p id="d_sum" style="font-size: 0.9rem;"></p></div>
            <div class="info-card"><h3>Gaps</h3><p id="d_gap" style="font-size: 0.9rem;"></p></div>
            <div class="info-card"><h3>Scope</h3><p id="d_scope" style="font-size: 0.9rem;"></p></div>
        </div>

        <h4 style="color: #444; font-size: 0.7rem; margin-top: 30px;">BIBTEX_CITATION:</h4>
        <div class="citation-section" id="d_cite"></div>

        <button class="btn-download" onclick="location.href='/export'">DOWNLOAD FULL REPORT</button>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    fileInput.onchange = () => { if(fileInput.files[0]) document.getElementById('fileLabel').innerText = "TARGET: " + fileInput.files[0].name; }

    async function runAnalysis() {
        if(!fileInput.files[0]) return alert("Select a PDF first!");
        
        document.getElementById('loader').style.display = 'block';
        document.getElementById('startBtn').style.display = 'none';
        
        const fd = new FormData();
        fd.append('pdf', fileInput.files[0]);

        try {
            const res = await fetch('/analyze', { method: 'POST', body: fd });
            const data = await res.json();

            // JS se display control karne ke bajay class remove kar rahe hain taaki responsive CSS rules break na ho
            document.getElementById('resultsArea').classList.remove('hidden');
            
            document.getElementById('d_prob').innerText = data.problem;
            document.getElementById('d_sum').innerText = data.summary;
            document.getElementById('d_gap').innerText = data.gaps;
            document.getElementById('d_scope').innerText = data.scope;
            document.getElementById('d_cite').innerText = data.citation;

            const mBox = document.getElementById('metricsBox');
            mBox.innerHTML = data.metrics.map(m => `<div class="metric-chip">${m}</div>`).join('');

        } catch (e) { alert("Error: " + e); }
        finally { document.getElementById('loader').style.display = 'none'; }
    }
</script>

</body>
</html>
